<!doctype html>
<html lang="en">
  <head>
    <title>MultiTrail</title>
    <meta property="og:description" content="Outdoor map with trail tracks." />
    <meta property="og:category" content="Outdoor map" />
    <meta property="og:created" content="2026-08-22" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #map {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <style>
      #file {
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
    <div id="map"></div>
    <input
      type="file"
      id="file"
      name="file"
      accept="application/geo+json,application/vnd.geo+json,.geojson"
    />
    <script type="module">
      import * as maplibregl from "https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.mjs";

      const map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/bright",
        center: [18, 49],
        zoom: 8,
      });

      function handleFileSelect(evt) {
        const file = evt.target.files[0]; // Read first selected file

        const reader = new FileReader();

        reader.onload = function (theFile) {
          // Parse as (geo)JSON
          const geoJSONcontent = JSON.parse(theFile.target.result);

          // Add as source to the map
          map.addSource("uploaded-source", {
            type: "geojson",
            data: geoJSONcontent,
          });

          map.addLayer({
            id: "uploaded-lines",
            type: "line",
            source: "uploaded-source",
            layout: {
              "line-cap": "round",
              "line-join": "round",
            },
            paint: {
              "line-color": "#d7191c",
              "line-width": 3,
            },
            filter: ["==", "$type", "LineString"],
          });

          map.addLayer({
            id: "uploaded-points",
            type: "circle",
            source: "uploaded-source",
            paint: {
              "circle-radius": 5,
              "circle-color": "#2c7fb8",
              "circle-stroke-color": "#ffffff",
              "circle-stroke-width": 2,
            },
            filter: ["==", "$type", "Point"],
          });
        };

        // Read the GeoJSON as text
        reader.readAsText(file, "UTF-8");
      }

      document
        .getElementById("file")
        .addEventListener("change", handleFileSelect, false);
    </script>
  </body>
</html>
