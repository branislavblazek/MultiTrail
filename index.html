<!doctype html>
<html lang="en">
  <head>
    <title>MultiTrail</title>
    <meta property="og:description" content="Outdoor map with trail tracks." />
    <meta property="og:category" content="Outdoor map" />
    <meta property="og:created" content="2026-08-22" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="map"></div>
    <button id="layerButton">🛠️</button>
    <div id="layerPanel" class="active">
      <span id="layerHint"
        >Create a layer by submitting a file (.gpx, .json, .geojson).</span
      >
      <input type="file" id="layerFile" accept=".gpx,.json,.geojson" />
      <div id="layerList"></div>
    </div>
    <script type="module">
      import { createMap } from "./script/map.js";
      import { initLayerPanel, initFileInput, pushLayer } from "./script/layer.js";

      const DEFAULT_TRACK = "./data/Ovciarsko-Peklina.gpx";

      const map = await createMap("map");

      initLayerPanel();
      initFileInput(map);

      try {
        const response = await fetch(DEFAULT_TRACK);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        pushLayer(map, DEFAULT_TRACK, await response.text());
      } catch (err) {
        console.error(`Could not load ${DEFAULT_TRACK}:`, err);
      }
    </script>
  </body>
</html>
