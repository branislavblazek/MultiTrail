<!doctype html>
<html lang="en">
  <head>
    <title>MultiTrail</title>
    <meta property="og:description" content="Outdoor map with trail tracks." />
    <meta property="og:category" content="Outdoor map" />
    <meta property="og:created" content="2026-08-22" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="map"></div>
    <button id="trailButton">🧭</button>
    <div id="trailPanel" class="active">
      <div id="trailHead">
        <span id="trailTitle">Trails</span>
        <span id="trailCount"></span>
        <button id="trailClose" title="Close panel">✕</button>
      </div>
      <div id="trailFilter"></div>
      <div id="trailList"></div>
    </div>
    <button id="layerButton">🛠️</button>
    <div id="layerPanel">
      <span id="layerHint"
        >Create a layer by submitting a file (.gpx, .json, .geojson).</span
      >
      <input type="file" id="layerFile" accept=".gpx,.json,.geojson" />
      <div id="layerList"></div>
    </div>
    <div id="detailPanel">
      <div id="detailHead">
        <span id="detailTitle"></span>
        <button id="detailClose" title="Close details">✕</button>
      </div>
      <div id="detailMeta"></div>
      <div id="detailBody"></div>
    </div>
    <script type="module">
      import { createMap } from "./script/map.js";
      import { initLayerPanel, initFileInput } from "./script/layer.js";
      import { initDetailPanel } from "./script/detail-panel.js";
      import { initLayerDetail } from "./script/layer-detail.js";
      import { loadTrails } from "./script/trails.js";
      import { initTrailPanel } from "./script/trail-panel.js";

      const TRAILS = "./data/trails.geojson";

      const map = await createMap("map");

      initLayerPanel();
      initFileInput(map);
      initDetailPanel();
      initLayerDetail(map);

      try {
        initTrailPanel(map, await loadTrails(map, TRAILS));
      } catch (err) {
        console.error(`Could not load ${TRAILS}:`, err);
      }
    </script>
  </body>
</html>
