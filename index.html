<!doctype html>
<html lang="sk">
  <head>
    <title>MultiTrail</title>
    <meta property="og:description" content="Outdoor map with trail tracks." />
    <meta property="og:category" content="Outdoor map" />
    <meta property="og:created" content="2026-08-22" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="brand">
      <img id="brandMark" src="./favicon.svg" alt="" width="28" height="28" />
      MultiTrail
    </div>

    <div id="chrome">
      <button id="trailsButton" class="chromeButton">
        <span class="chromeIcon">🧭</span>
        <span class="chromeLabel">Hľadať trasy</span>
      </button>
      <button id="layerButton" class="chromeButton">
        <span class="chromeIcon">🛠️</span>
        <span class="chromeLabel">Autorské nástroje</span>
      </button>
    </div>

    <section id="sheet" class="peek">
      <button id="sheetHandle" aria-label="Rozbaliť zoznam"></button>

      <div id="sheetHead">
        <div id="sheetTitles">
          <span class="eyebrow">MultiTrail</span>
          <h1 id="sheetTitle">Trasy v okolí</h1>
        </div>
        <button id="filterButton">≡ Filtre</button>
      </div>

      <div id="sheetSummary">
        <strong id="trailCount"></strong>
        <span id="sheetSummaryLabel">odporúčané trasy a miesta</span>
        <button id="resetButton" class="resetLink">Resetovať</button>
      </div>

      <div id="trailList"></div>

      <div id="filterSheet" hidden>
        <div id="filterHead">
          <button id="filterClose" title="Zavrieť filtre">✕</button>
          <span id="filterTitle">Filtre</span>
          <button id="filterReset" class="resetLink">Resetovať</button>
        </div>
        <div id="filterGrid"></div>
        <button id="filterApply"></button>
      </div>
    </section>

    <div id="layerPanel">
      <span class="eyebrow">Author mode</span>
      <h2 id="layerTitle">Publikovať trasu</h2>
      <span id="layerHint">Načítať GPX · zjednodušiť · nastaviť štýl</span>
      <label id="layerFileLabel">
        Vybrať GPX súbor
        <input type="file" id="layerFile" accept=".gpx,.json,.geojson" />
      </label>
      <div id="layerList"></div>
    </div>

    <section id="detailPanel">
      <div id="detailHead">
        <span id="detailEyebrow" class="eyebrow"></span>
        <h2 id="detailTitle"></h2>
        <button id="detailClose" title="Zavrieť detail">✕</button>
      </div>
      <div id="detailBody"></div>
    </section>

    <script type="module">
      import { createMap } from "./script/map.js";
      import { initLayerPanel, initFileInput } from "./script/layer.js";
      import { initDetailPanel } from "./script/detail-panel.js";
      import { initLayerDetail } from "./script/layer-detail.js";
      import { loadTrails } from "./script/trails.js";
      import { initTrailPanel } from "./script/trail-panel.js";

      const TRAILS = "./data/trails.geojson";

      const map = await createMap("map");

      initLayerPanel();
      initFileInput(map);
      initDetailPanel();
      initLayerDetail(map);

      try {
        initTrailPanel(map, await loadTrails(map, TRAILS));
      } catch (err) {
        console.error(`Could not load ${TRAILS}:`, err);
      }
    </script>
  </body>
</html>
